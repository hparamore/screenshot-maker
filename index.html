<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screenshot Maker</title>
    <!--
      Self-hosted rather than loaded from Google Fonts. PNG export inlines every @font-face it
      can read, and a cross-origin stylesheet is unreadable — which cost an export ~130 network
      round trips and risked falling back to the wrong typeface. Same-origin CSS just works,
      and the app runs offline. See public/fonts/webfonts.css.
    -->
    <link href="/fonts/webfonts.css" rel="stylesheet">
    <!--
      Families installed from the Google Fonts browser, or dropped in as your own files. This
      stylesheet is GENERATED by vite-plugin-fonts.js and rebuilt from disk on every dev-server
      start, which is why it is separate from the hand-maintained webfonts.css above: an
      install can add or remove declarations without ever rewriting that file.

      Downloaded once, then served from disk like everything else. Nothing here reaches a CDN.
      The id is how src/utils/fontServer.js re-links it after an install, so a new family is
      usable without restarting Vite.
    -->
    <link id="installed-fonts" href="/fonts/installed/installed.css" rel="stylesheet">
    <!--
      Fonts you dropped into public/fonts/custom/ yourself — the drop folder. Also GENERATED by
      vite-plugin-fonts.js: it scans that folder from raw font files (no metadata needed) on every
      dev-server start and on Rescan, and re-links this sheet via its id, exactly like installed.css
      above. Same-origin files, so exports stay offline. See public/fonts/custom/README.md.
    -->
    <link id="custom-fonts" href="/fonts/custom/custom.css" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
